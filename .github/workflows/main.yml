name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD secret is missing"
              exit 1
          }

          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser `
                  -Name "RDP" `
                  -Password $securePassword
          }
          else {
              New-LocalUser `
                  -Name "RDP" `
                  -Password $securePassword `
                  -AccountNeverExpires
          }

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue

          Write-Host "RDP user ready"

      - name: Install and Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-rdp-${{ github.run_id }}
          version: latest
          log-mode: quiet

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tsIP = tailscale ip -4

          if (-not $tsIP) {
              Write-Error "Could not get Tailscale IP"
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "=============================="
          Write-Host "RDP READY"
          Write-Host "Address: $tsIP"
          Write-Host "Username: RDP"
          Write-Host "Password: stored in RDP_PASSWORD secret"
          Write-Host "=============================="

      - name: Verify RDP
        shell: powershell
        run: |
          $result = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port is not reachable"
              exit 1
          }

          Write-Host "RDP is reachable"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP session active"

          while ($true) {
              Write-Host "[$(Get-Date)] Runner active"
              Start-Sleep -Seconds 300
          }
